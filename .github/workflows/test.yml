name: Lint & Test

# запуск на каждый push и pull request
on:
  push:
    branches: ['**']
  pull_request:

# lint не требует Rust; tanks собирает и тестирует игровой Rust-крейт +
# web-таргет ядра (client/host-плагины грузят wasm-glue статически);
# integration гоняет сквозные тесты на реальном ядре (нужны оба таргета —
# node-таргет для tests/core/helpers.js, web-таргет — для того же импорта
# плагина, что и в tanks-job). Перенесено из CI движка (A3.5/A3.6 плана
# отделения движка) — @vimp/engine ставится здесь из npm registry, а не из
# workspace-симлинка.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

  tanks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (vimp-tanks-core)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-tanks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: npm ci

      - name: Rust tests (игровой crate)
        run: cargo test -p vimp-tanks-core

      - name: Build core (web-таргет — client/host-плагины грузят wasm-glue статически)
        run: npm run core:build:web

      - name: JS tests (игра)
        run: npx vitest run --project tanks

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (cargo workspace: core)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: npm ci

      # web-таргет нужен harness.js (динамический import @vimp/tanks/host/index.js
      # статически грузит pkg-web) наравне с node-таргетом (JS↔WASM хелперы
      # tests/core/helpers.js) — сборка только node-таргета ловится этим
      # шагом молча в других раскладках CI, поэтому оба явно
      - name: Build core (оба таргета — web и nodejs)
        run: npm run core:build

      - name: JS↔WASM integration tests (реальное ядро танков)
        run: npx vitest run --project integration
