[workspace]
resolver = "2"
members = ["core"]

[workspace.dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
rapier2d = { version = "0.34.0", features = ["enhanced-determinism", "serde-serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.126"

[profile.release]
opt-level = 3
lto = true

# ВРЕМЕННО (plan/prediction-drift.md, этап 5): спекулятивные контакты,
# манифольд и накопленные импульсы живут в НЕОПУБЛИКОВАННОМ движке.
# Снять сразу после публикации крейта 0.15.0, одновременно подняв версию в
# core/Cargo.toml, — танки зависят от крейта по версии, а не по пути.
[patch.crates-io]
vimp-engine-core = { path = "../vimp/packages/engine/core" }
