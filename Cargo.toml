[workspace]
resolver = "2"
members = ["core"]

[workspace.dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
rapier2d = { version = "0.34.0", features = ["enhanced-determinism", "serde-serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.126"

[profile.release]
opt-level = 3
lto = true

# Временная связка с локальным движком на время работ плана
# plan/ramp-entry-descent.md — снимается на этапе 4.
# Патч обязан жить в корне воркспейса: в core/Cargo.toml cargo его игнорирует.
[patch.crates-io]
vimp-engine-core = { path = "/Users/dmitry/Sites/my/vimp/packages/engine/core" }
